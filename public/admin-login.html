<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#07111d" />
    <title>ReVector — Support & Operations Console</title>
    <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgdmlld0JveD0iMCAwIDMyIDMyIj48cmVjdCB3aWR0aD0iMzIiIGhlaWdodD0iMzIiIHJ4PSI4IiBmaWxsPSIjZDZhZjY0Ii8+PHBhdGggZD0ibTggMjAtMSA1IDUtMUwyNSAxMWwtNS01TDggMjBabTEwLTEyIDUgNSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMDkxNTIzIiBzdHJva2Utd2lkdGg9IjEuOCIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIi8+PC9zdmc+Cg==" type="image/svg+xml" />
    <style>
/* System fallback keeps the workspace functional without third-party network requests. */
@font-face {
  font-family: Inter;
  src: local("Inter");
  font-style: normal;
  font-weight: 100 900;
  font-display: swap;
}

:root {
  --brand: #6d3dee;
  --brand-soft: #f0eaff;
  --ink: #20212d;
  --muted: #717383;
  --surface: #f7f7fa;
  --canvas: #f0f0f5;
  --border: #e4e4ed;
  --green: #16815b;
  --green-soft: #e8f6ee;
  --amber: #9d650f;
  --amber-soft: #fff4dd;
  --red: #b9374b;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--surface);
  color: var(--ink);
  font-family: Inter, Arial, sans-serif;
  font-size: 13px;
}
button,
input,
select {
  font: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 3px solid #bea9f9;
  outline-offset: 3px;
}
a {
  color: var(--brand);
}
button {
  border: 1px solid var(--border);
  background: var(--panel);
  border-radius: 8px;
  padding: 10px 14px;
  color: var(--ink);
  line-height: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  white-space: nowrap;
}
button:hover:not(:disabled) {
  background: var(--surface);
  border-color: #cfc8e0;
}
.primary {
  background: var(--brand);
  border-color: var(--brand);
  color: white;
}
.primary:hover:not(:disabled) {
  background: #ba944e;
  border-color: #5c30d5;
}
.quiet {
  border-color: transparent;
  background: transparent;
}
.danger {
  color: var(--red);
}
.icon-button {
  padding: 7px;
  min-width: 32px;
}
.icon {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  vertical-align: middle;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1 {
  font-size: 20px;
  font-weight: 650;
  letter-spacing: -0.4px;
}
h2 {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.25px;
}
h3 {
  font-size: 13px;
  font-weight: 600;
}
p {
  line-height: 1.65;
}
.muted {
  color: var(--muted);
}
.small {
  font-size: 11px;
}
.row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.between {
  justify-content: space-between;
}
.stack {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.divider {
  height: 1px;
  background: var(--border);
  margin: 4px 0;
}
.badge {
  font-size: 10px;
  font-weight: 500;
  border-radius: 7px;
  padding: 6px 9px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  background: var(--surface);
  color: var(--muted);
}
.badge.purple {
  background: var(--brand-soft);
  color: var(--brand);
}
.badge.success {
  background: var(--green-soft);
  color: var(--green);
}
.badge.warning {
  background: var(--amber-soft);
  color: var(--amber);
}
.badge.error {
  background: #301d27;
  color: var(--red);
}
.topbar {
  height: 64px;
  background: var(--panel);
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 0 24px;
  border-bottom: 1px solid var(--border);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 220px;
  flex-shrink: 0;
}
.brand-mark {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--brand);
  color: white;
  display: grid;
  place-items: center;
}
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}
.project-name {
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.topbar .right {
  margin-left: auto;
  display: flex;
  gap: 12px;
  align-items: center;
}
.avatar {
  width: 30px;
  height: 30px;
  background: var(--brand-soft);
  color: var(--brand);
  border-radius: 50%;
  display: grid;
  place-items: center;
}
.stepper {
  background: var(--panel);
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 18px;
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
}
.step {
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: flex-start;
  text-align: left;
  border: 0;
  padding: 0;
  border-radius: 0;
  background: transparent;
}
.step:hover:not(:disabled) {
  background: transparent;
}
.step-number {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--surface);
  color: var(--muted);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.step.active .step-number,
.step.complete .step-number {
  background: var(--brand);
  color: white;
}
.step.active strong {
  color: var(--brand);
}
.step strong {
  font-weight: 500;
  font-size: 12px;
}
.step small {
  display: block;
  color: var(--muted);
  font-size: 10px;
  margin-top: 4px;
}
.workspace {
  max-width: 1920px;
  margin: auto;
  padding: 24px;
  display: grid;
  grid-template-columns: 248px minmax(420px, 1fr) 280px;
  gap: 16px;
  align-items: start;
  min-height: calc(100vh - 220px);
  padding-bottom: 105px;
}
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
}
.sidebar,
.inspector {
  min-height: 650px;
}
.main-column {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.sidebar label,
.inspector label,
.project-form label {
  font-size: 11px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  color: var(--muted);
}
input[type="text"],
input[type="number"],
select {
  width: 100%;
  height: 40px;
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 0 10px;
  background: var(--panel);
  color: var(--ink);
  min-width: 0;
}
input[type="checkbox"] {
  accent-color: var(--brand);
  width: 15px;
  height: 15px;
  flex-shrink: 0;
}
.checkbox {
  display: flex !important;
  flex-direction: row !important;
  align-items: center;
  gap: 9px !important;
  color: var(--ink) !important;
  font-size: 12px !important;
}
.two-fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.presets {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
}
.presets button {
  font-size: 11px;
  padding: 8px;
}
.presets .selected,
.tab.selected {
  background: var(--brand-soft);
  border-color: #b79bef;
  color: var(--brand);
}
.full-width {
  width: 100%;
}
.dropzone {
  border: 1px dashed #d3c7ee;
  border-radius: 10px;
  background: var(--surface);
  min-height: 320px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 25px;
  text-align: center;
}
.dropzone.drag-over {
  background: var(--brand-soft);
  border-color: var(--brand);
}
.upload-icon {
  height: 58px;
  width: 58px;
  background: var(--brand-soft);
  color: var(--brand);
  display: grid;
  place-items: center;
  border-radius: 15px;
}
.upload-icon .icon {
  width: 28px;
  height: 28px;
}
.source-thumbnail {
  max-height: 245px;
  max-width: 90%;
  object-fit: contain;
  border-radius: 6px;
}
.empty-image {
  min-height: 300px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  gap: 14px;
}
.analysis-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.metric {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
}
.metric strong {
  display: block;
  font-size: 18px;
  font-weight: 550;
  margin-bottom: 5px;
}
.metric span {
  font-size: 10px;
  color: var(--muted);
}
.note {
  background: var(--surface);
  border-radius: 8px;
  padding: 12px;
  font-size: 11px;
  color: var(--muted);
  line-height: 1.65;
}
.note.warning {
  background: var(--amber-soft);
  color: var(--amber);
}
.note.error {
  background: #301d27;
  color: var(--red);
}
.parts-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.part-row {
  display: flex;
  text-align: left;
  justify-content: flex-start;
  gap: 10px;
  border: 1px solid transparent;
  padding: 8px;
  width: 100%;
  border-radius: 8px;
  min-height: 64px;
  white-space: normal;
}
.part-row.active {
  background: var(--brand-soft);
  border-color: var(--brand-soft);
}
.part-row img {
  width: 34px;
  height: 46px;
  object-fit: contain;
}
.part-row strong {
  font-size: 12px;
  font-weight: 500;
  display: block;
  line-height: 1.5;
}
.part-row.active strong {
  color: var(--brand);
}
.part-row small {
  display: block;
  line-height: 1.6;
  font-size: 10px;
  color: var(--muted);
}
.part-row .confirmed {
  color: var(--green);
}
.part-row .unconfirmed {
  color: var(--amber);
}
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.tabs {
  display: flex;
  gap: 5px;
}
.tab {
  padding: 7px 12px;
  font-size: 11px;
}
.canvas-viewport {
  overflow: auto;
  background: var(--canvas);
  border-radius: 8px;
  min-height: 380px;
  position: relative;
  padding: 18px;
  display: grid;
  place-items: center;
}
.artboard {
  position: relative;
  max-width: 100%;
  margin: auto;
}
.artboard > img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 490px;
  object-fit: contain;
}
.artboard svg.overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}
.boundary {
  fill: transparent;
  stroke: #926dff;
  stroke-width: 2;
  vector-effect: non-scaling-stroke;
  cursor: pointer;
}
.boundary.selected {
  fill: #6d3dee18;
  stroke: var(--brand);
  stroke-width: 2.5;
}
.boundary.confirmed {
  stroke: #16815b;
}
.draw-mode {
  cursor: crosshair;
}
.drawing-line {
  fill: #6d3dee18;
  stroke: #6d3dee;
  stroke-width: 2;
  vector-effect: non-scaling-stroke;
}
.draw-point {
  fill: white;
  stroke: #6d3dee;
  stroke-width: 2;
  vector-effect: non-scaling-stroke;
}
.compare-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.preview-pane {
  background: var(--surface);
  border-radius: 8px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.preview-art {
  height: 380px;
  display: grid;
  place-items: center;
  overflow: auto;
}
.preview-art > img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}
.preview-art svg {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  display: block;
}
.wide-preview .preview-art {
  height: 490px;
}
.preview-art .editable-shape {
  cursor: pointer;
}
.preview-art .editable-shape:hover {
  filter: drop-shadow(0 0 2px #6d3dee);
}
.preview-art .selected-shape {
  stroke: #ff2baa !important;
  stroke-width: 1.1 !important;
  vector-effect: non-scaling-stroke;
}
.swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}
.swatch {
  width: 29px;
  height: 29px;
  border-radius: 7px;
  display: block;
  border: 1px solid #0001;
  padding: 0;
}
.layer-row {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 28px;
  font-size: 11px;
}
.layer-row button {
  border: 0;
  padding: 4px;
  background: transparent;
}
.layer-row .layer-count {
  margin-left: auto;
  color: var(--muted);
  font-size: 10px;
}
.color-input {
  width: 100%;
  height: 40px;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px;
  background: var(--panel);
}
.report-metrics {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.report-metrics div {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 12px;
}
.report-metrics span {
  color: var(--muted);
}
.validation-warning {
  max-height: 140px;
  overflow: auto;
}
.part-tiles {
  display: flex;
  overflow: auto;
  gap: 12px;
  padding-bottom: 8px;
}
.part-tile {
  min-width: 140px;
  max-width: 170px;
  flex: 1;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  background: var(--surface);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.part-tile.checked {
  background: var(--brand-soft);
  border-color: #b79bef;
}
.part-tile img {
  height: 92px;
  width: 100%;
  object-fit: contain;
}
.part-tile label {
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: 11px;
  font-weight: 500;
}
.formats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.format {
  flex-direction: column;
  align-items: flex-start;
  gap: 5px;
  min-height: 86px;
  padding: 14px;
}
.format strong {
  font-size: 18px;
  font-weight: 600;
}
.format small {
  font-size: 10px;
  color: var(--muted);
}
.format.selected {
  border-color: var(--brand);
  background: var(--brand-soft);
  color: var(--brand);
}
.file-table {
  width: 100%;
  border-collapse: collapse;
}
.file-table td {
  padding: 12px 4px;
  border-top: 1px solid var(--border);
  font-size: 12px;
}
.file-table img {
  height: 38px;
  width: 30px;
  object-fit: contain;
}
.file-table td:last-child {
  text-align: right;
}
.bottom-bar {
  background: var(--panel);
  border-top: 1px solid var(--border);
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 20;
  min-height: 76px;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.bottom-bar .actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}
.busy-banner {
  background: var(--brand-soft);
  color: var(--brand);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.spinner {
  height: 16px;
  width: 16px;
  border-radius: 50%;
  border: 2px solid #b69aee;
  border-top-color: var(--brand);
  animation: spin 1s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
.boot {
  padding: 80px;
  text-align: center;
  color: var(--muted);
}
#toast {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translate(-50%, -15px);
  background: var(--ink);
  color: white;
  padding: 12px 20px;
  border-radius: 9px;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: 0.2s;
  max-width: 90vw;
  font-size: 12px;
  box-shadow: 0 8px 30px #20212d25;
}
#toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
dialog {
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 24px;
  width: min(700px, 92vw);
  max-height: 85vh;
  color: var(--ink);
}
dialog::backdrop {
  background: #20212d66;
}
dialog header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
dialog pre {
  background: var(--surface);
  padding: 16px;
  overflow: auto;
  max-height: 50vh;
  font-size: 11px;
  line-height: 1.6;
}
.tips li {
  line-height: 1.7;
  margin-bottom: 12px;
}
.tips {
  padding-left: 18px;
  margin: 0;
  color: var(--muted);
  font-size: 12px;
}
.nosource {
  margin: 20px 0;
}
.requirements {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.requirement {
  display: grid;
  grid-template-columns: 1.6fr 1fr 1fr 32px;
  gap: 8px;
  align-items: center;
}
.requirements-head {
  font-size: 10px;
  color: var(--muted);
}
.status-error {
  padding: 12px 24px;
  border-bottom: 1px solid #eed0d6;
  background: #301d27;
  color: var(--red);
  display: flex;
  gap: 12px;
  align-items: center;
  line-height: 1.6;
}
.status-error button {
  margin-left: auto;
}
.comparison-caption {
  font-size: 10px;
  color: var(--muted);
}
.preview-art > img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
@media (min-width: 1700px) {
  .preview-art {
    height: 470px;
  }
  .canvas-viewport {
    min-height: 470px;
  }
}
@media (max-width: 1180px) {
  .workspace {
    grid-template-columns: 210px minmax(360px, 1fr) 250px;
    padding: 16px;
    gap: 12px;
    padding-bottom: 110px;
  }
  .card {
    padding: 16px;
  }
  .brand {
    width: 185px;
  }
  .topbar {
    padding: 0 16px;
  }
  .stepper {
    padding: 16px;
  }
  .formats {
    grid-template-columns: 1fr 1fr;
  }
  .preview-art {
    height: 300px;
  }
  .topbar .badge {
    display: none;
  }
  .preview-pane {
    padding: 10px;
  }
  .analysis-grid {
    grid-template-columns: 1fr 1fr;
  }
  .requirement {
    grid-template-columns: 1.5fr 1fr 1fr 30px;
  }
}
@media (max-width: 980px) {
  .workspace {
    grid-template-columns: 190px minmax(320px, 1fr);
  }
  .inspector {
    grid-column: 2;
    min-height: 0;
  }
  .sidebar {
    grid-row: span 2;
    min-height: 650px;
  }
  .stepper {
    gap: 8px;
  }
  .step strong {
    font-size: 11px;
  }
  .step small {
    display: none;
  }
  .step-number {
    width: 26px;
    height: 26px;
  }
  .topbar .breadcrumb > span:first-child,
  .topbar .breadcrumb > .icon {
    display: none;
  }
  .topbar .right .quiet {
    display: none;
  }
}
@media (max-width: 650px) {
  .topbar {
    height: 58px;
    padding: 0 12px;
    gap: 8px;
  }
  .brand {
    width: auto;
  }
  .brand h1 {
    font-size: 17px;
  }
  .breadcrumb {
    max-width: 130px;
  }
  .project-name {
    font-size: 11px;
  }
  .topbar .avatar {
    display: none;
  }
  .stepper {
    padding: 12px 8px;
    gap: 3px;
  }
  .step {
    flex-direction: column;
    gap: 6px;
    text-align: center;
  }
  .step strong {
    font-size: 9px;
  }
  .workspace {
    display: flex;
    flex-direction: column;
    padding: 12px;
    padding-bottom: 135px;
  }
  .sidebar,
  .inspector,
  .main-column {
    width: 100%;
    min-height: 0;
  }
  .sidebar .parts-list {
    display: flex;
    flex-direction: row;
    overflow: auto;
  }
  .part-row {
    min-width: 150px;
    max-width: 180px;
  }
  .sidebar .project-form {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .sidebar .settings-detail {
    display: none;
  }
  .card {
    padding: 16px;
  }
  .compare-grid {
    grid-template-columns: 1fr;
  }
  .preview-art {
    height: 320px;
  }
  .bottom-bar {
    padding: 12px;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
  }
  .bottom-bar .actions {
    margin: 0;
    justify-content: flex-end;
  }
  .bottom-bar .muted {
    font-size: 10px;
  }
  .file-table .dimension-cell {
    display: none;
  }
  .formats {
    gap: 8px;
  }
  .requirement {
    grid-template-columns: 1.4fr 1fr 1fr 26px;
  }
  .requirement input {
    padding: 0 5px;
  }
  .busy-banner,
  .status-error {
    padding: 10px 12px;
  }
  .dropzone {
    min-height: 260px;
  }
  .source-thumbnail {
    max-height: 200px;
  }
}

.connection-status {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 28px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.connection-segments {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 24px;
}
.connection-segment {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
}
.status-light {
  width: 7px;
  height: 7px;
  flex-shrink: 0;
  border-radius: 50%;
  background: #bcc0cb;
}
.connection-segment.connected {
  color: var(--green);
}
.connection-segment.connected .status-light {
  background: var(--green);
  box-shadow: 0 0 0 3px var(--green-soft);
}
.connection-segment.failed {
  color: var(--red);
}
.connection-segment.failed .status-light {
  background: var(--red);
  box-shadow: 0 0 0 3px #fce8ec;
}
.connection-segment.pending .status-light {
  background: var(--brand);
  animation: connection-pulse 1s ease-in-out infinite;
}
.connection-retry {
  border: 0;
  padding: 2px 4px;
  background: transparent;
  color: var(--red);
  text-decoration: underline;
  font-size: 11px;
}
.connection-summary {
  color: var(--muted);
  font-weight: 600;
  white-space: nowrap;
}
.connection-summary.ready {
  color: var(--green);
}
@keyframes connection-pulse {
  50% {
    opacity: 0.25;
  }
}
@media (prefers-reduced-motion: reduce) {
  .connection-segment.pending .status-light {
    animation: none;
  }
}
@media (max-width: 600px) {
  .connection-status {
    padding: 10px 12px;
    align-items: flex-start;
    font-size: 10px;
  }
  .connection-segments {
    gap: 8px 12px;
  }
  .connection-segment {
    gap: 5px;
    flex-wrap: wrap;
  }
  .connection-retry {
    font-size: 10px;
  }
}


/* ReVector approved engine-contract UI */
.section-kicker {
  color: var(--brand);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  margin-bottom: 5px;
}
.wrap {
  flex-wrap: wrap;
}
.topbar {
  position: relative;
}
.topbar-center {
  flex: 1;
  min-width: 40px;
}
.menu-button {
  width: 38px;
  height: 38px;
  border-radius: 10px;
}
.menu-popover {
  position: absolute;
  top: 54px;
  right: 22px;
  width: 280px;
  z-index: 30;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 18px 48px rgba(32, 33, 45, 0.14);
}
.presets.three {
  grid-template-columns: repeat(3, 1fr);
}
.preset-copy {
  min-height: 52px;
}
.engine-statuses {
  gap: 8px;
}
.engine-card {
  border: 1px solid var(--border);
  background: var(--panel);
  border-radius: 10px;
  padding: 12px;
}
.engine-card.success {
  border-color: #cce7da;
  background: #0c241f;
}
.engine-card.warning {
  border-color: #f0d9af;
  background: #292419;
}
.engine-card.error {
  border-color: #efcbd2;
  background: #2a1924;
}
.upload-card {
  min-height: 470px;
}
.dropzone.has-artwork {
  min-height: 360px;
}
.file-facts {
  width: min(760px, 100%);
  display: grid;
  grid-template-columns: 1.5fr 1fr 1fr;
  gap: 8px;
}
.file-facts span {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
  text-align: left;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.file-facts strong {
  color: var(--muted);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.upload-actions {
  justify-content: center;
}
.requirements-card {
  min-height: 150px;
}
.split-reference {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.empty-preview {
  height: 100%;
  min-height: 180px;
  display: grid;
  place-items: center;
  text-align: center;
  color: var(--muted);
  padding: 24px;
}
.processing-panel {
  display: flex;
  gap: 18px;
  align-items: center;
  min-height: 150px;
  padding: 18px;
  background: #faf9ff;
  border: 1px solid #e5dcfb;
  border-radius: 12px;
}
.processing-orb {
  width: 52px;
  height: 52px;
  flex: 0 0 auto;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--brand-soft);
}
.processing-orb span {
  width: 20px;
  height: 20px;
  border: 2px solid #cfc1f5;
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: revector-spin 1.1s linear infinite;
}
.processing-copy {
  min-width: 0;
  flex: 1;
}
@keyframes revector-spin {
  to { transform: rotate(360deg); }
}
.detection-canvas {
  min-height: 450px;
}
.draw-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: var(--brand-soft);
  border: 1px solid #ddd0fb;
  border-radius: 9px;
  padding: 12px;
}
.slot-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.slot-card {
  display: grid;
  grid-template-columns: 92px minmax(0, 1fr);
  gap: 12px;
  align-items: center;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px;
  background: #fff;
  min-height: 122px;
}
.slot-card.active {
  border-color: #b79bef;
  box-shadow: 0 0 0 2px var(--brand-soft);
}
.slot-card.uncertain,
.slot-card.missing {
  background: #292419;
}
.slot-card.confirmed {
  background: #0c241f;
}
.slot-preview {
  width: 92px;
  height: 96px;
  background: var(--surface);
  border-radius: 8px;
  overflow: hidden;
  display: grid;
  place-items: center;
}
.slot-preview img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}
.slot-placeholder {
  color: #aaa7b6;
}
.slot-content {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.slot-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.slot-actions button {
  padding: 6px 8px;
  font-size: 10px;
}
.warning-action {
  color: var(--amber);
  border-color: #efcf91;
  background: var(--amber-soft);
}
.compact-parts {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.compact-parts button {
  min-width: 180px;
  justify-content: flex-start;
  text-align: left;
}
.compact-parts button.active {
  border-color: #b79bef;
  background: var(--brand-soft);
}
.compact-parts img {
  width: 42px;
  height: 54px;
  object-fit: contain;
}
.compact-parts span {
  display: flex;
  flex-direction: column;
  white-space: normal;
}
.review-confirm-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.vector-main,
.validation-main,
.download-main {
  grid-column: 1 / -1;
}
.vector-parts {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}
.vector-part {
  min-width: 0;
  justify-content: flex-start;
  text-align: left;
  white-space: normal;
  padding: 8px;
}
.vector-part.active {
  border-color: #b79bef;
  background: var(--brand-soft);
}
.vector-part-thumb {
  width: 44px;
  height: 54px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  background: var(--surface);
  border-radius: 6px;
}
.vector-part-thumb img {
  max-width: 100%;
  max-height: 100%;
}
.vector-part > span {
  min-width: 0;
  display: flex;
  flex: 1;
  flex-direction: column;
}
.vector-part small {
  color: var(--muted);
  font-size: 9px;
}
.vector-split,
.validation-split {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(310px, 0.7fr);
  gap: 16px;
  align-items: start;
}
.vector-stage .preview-art {
  min-height: 480px;
  height: 58vh;
  max-height: 720px;
}
.vector-preview svg {
  max-width: 100%;
  max-height: 100%;
  width: 100%;
  height: 100%;
}
.editable-shape {
  cursor: crosshair;
  transition: filter 0.12s ease, stroke-width 0.12s ease;
}
.editable-shape:hover {
  filter: brightness(1.05);
}
.selected-shape {
  stroke: var(--brand) !important;
  stroke-width: 3 !important;
  vector-effect: non-scaling-stroke;
}
.selected-shape-box {
  background: var(--surface);
  border-radius: 8px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  overflow-wrap: anywhere;
}
.color-input {
  width: 100%;
  height: 54px;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px;
  background: var(--panel);
}
.source-reference-card {
  display: grid;
  grid-template-columns: 1fr 120px;
  gap: 16px;
  align-items: center;
}
.source-reference-card img {
  width: 120px;
  height: 90px;
  object-fit: contain;
  background: var(--surface);
  border-radius: 8px;
}
.validation-parts {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.validation-part {
  width: 100%;
  justify-content: flex-start;
  text-align: left;
  white-space: normal;
}
.validation-part.active {
  border-color: #b79bef;
  background: var(--brand-soft);
}
.validation-part img {
  width: 44px;
  height: 54px;
  object-fit: contain;
}
.validation-part > span {
  display: flex;
  flex: 1;
  flex-direction: column;
}
.compatibility-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-top: 1px solid var(--border);
  padding-top: 12px;
}
.validation-recovery {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.download-parts {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}
.download-part {
  min-width: 0;
  display: grid;
  grid-template-columns: 18px 48px minmax(0, 1fr);
  grid-template-rows: auto auto;
  column-gap: 8px;
  align-items: center;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  cursor: pointer;
}
.download-part.selected {
  border-color: #b79bef;
  background: #fcfaff;
}
.download-part > .badge {
  grid-column: 2 / -1;
  justify-self: start;
  margin-top: 6px;
}
.download-thumb {
  width: 48px;
  height: 60px;
  display: grid;
  place-items: center;
  background: var(--surface);
  border-radius: 6px;
}
.download-thumb img {
  max-width: 100%;
  max-height: 100%;
}
.download-part > span {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.download-part small {
  color: var(--muted);
}
.export-formats {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}
.export-formats .format {
  min-height: 78px;
}
.production-pack-card {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(280px, 420px);
  gap: 24px;
  align-items: center;
}
.pack-copy {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.download-primary-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.download-primary {
  min-height: 46px;
  width: 100%;
}
.post-download {
  display: grid;
  grid-template-columns: 1fr auto 1fr auto;
  gap: 12px;
  align-items: center;
}
.connection-lost {
  position: sticky;
  top: 0;
  z-index: 28;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 14px;
  align-items: center;
  padding: 12px 24px;
  background: #fff5f6;
  border-bottom: 1px solid #efcbd2;
  color: var(--red);
}
.connection-lost p {
  font-size: 11px;
}
.assistant-shell {
  position: fixed;
  right: 22px;
  bottom: 82px;
  z-index: 60;
  width: min(620px, calc(100vw - 32px));
  max-height: min(74vh, 500px);
}
.assistant-card {
  background: var(--panel);
  border: 1px solid #ded7ee;
  border-radius: 18px;
  box-shadow: 0 24px 72px rgba(32, 33, 45, 0.2);
  overflow: hidden;
}
.assistant-card > header {
  min-height: 68px;
  padding: 14px 16px;
  background: #faf9ff;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.assistant-title {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--brand);
}
.assistant-title > span {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.assistant-title small {
  color: var(--muted);
  font-size: 10px;
}
.assistant-body {
  padding: 18px;
  max-height: calc(min(74vh, 500px) - 68px);
  overflow: auto;
}
.assistant-source {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.error-summary {
  border-left: 3px solid var(--red);
  background: #fff8f9;
  border-radius: 7px;
  padding: 12px 14px;
}
.error-summary p {
  margin-top: 5px;
}
.error-summary small {
  color: var(--muted);
}
.assistant-question,
.assistant-guidance {
  border-top: 1px solid var(--border);
  padding-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.assistant-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}
.assistant-followup {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: end;
  gap: 8px;
}
.assistant-followup label {
  display: flex;
  flex-direction: column;
  gap: 6px;
  color: var(--muted);
  font-size: 10px;
}
.assistant-followup input {
  width: 100%;
  height: 40px;
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 0 10px;
}
.error-details pre {
  overflow: auto;
  white-space: pre-wrap;
  background: #171820;
  color: #f4f4f8;
  border-radius: 8px;
  padding: 12px;
  font-size: 10px;
}
.assistant-pill {
  position: fixed;
  right: 22px;
  bottom: 84px;
  z-index: 58;
  border-color: #d8caf7;
  color: var(--brand);
  box-shadow: 0 8px 30px rgba(32, 33, 45, 0.12);
}
.status-error {
  gap: 10px;
}
.badge.neutral {
  background: var(--surface);
  color: var(--muted);
}

@media (prefers-reduced-motion: reduce) {
  .processing-orb span {
    animation: none;
  }
  .editable-shape {
    transition: none;
  }
}
@media (max-width: 1180px) {
  .slot-grid {
    grid-template-columns: 1fr;
  }
  .vector-parts,
  .download-parts {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .vector-split,
  .validation-split {
    grid-template-columns: 1fr;
  }
}
@media (max-width: 980px) {
  .vector-main,
  .validation-main,
  .download-main {
    grid-column: 1 / -1;
  }
  .post-download {
    grid-template-columns: 1fr auto;
  }
}
@media (max-width: 650px) {
  .topbar-center {
    display: none;
  }
  .topbar .right {
    gap: 4px;
  }
  .menu-popover {
    right: 10px;
    top: 52px;
    width: min(280px, calc(100vw - 20px));
  }
  .file-facts,
  .split-reference,
  .production-pack-card {
    grid-template-columns: 1fr;
  }
  .slot-card {
    grid-template-columns: 70px minmax(0, 1fr);
  }
  .slot-preview {
    width: 70px;
    height: 82px;
  }
  .vector-parts,
  .download-parts,
  .export-formats {
    grid-template-columns: 1fr 1fr;
  }
  .vector-stage .preview-art {
    min-height: 330px;
    height: 48vh;
  }
  .review-confirm-card {
    align-items: stretch;
    flex-direction: column;
  }
  .post-download {
    grid-template-columns: 1fr;
  }
  .connection-lost {
    grid-template-columns: auto 1fr;
    padding: 10px 12px;
  }
  .connection-lost button {
    grid-column: 1 / -1;
  }
  .assistant-shell {
    left: 10px;
    right: 10px;
    bottom: 88px;
    width: auto;
    max-height: 72vh;
  }
  .assistant-body {
    max-height: calc(72vh - 68px);
  }
  .assistant-followup {
    grid-template-columns: 1fr;
  }
  .assistant-pill {
    right: 12px;
    bottom: 92px;
  }
}

.upload-status-dialog {
  position: fixed;
  top: 86px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 55;
  width: min(430px, calc(100vw - 28px));
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--panel);
  border: 1px solid #ded7ee;
  border-radius: 14px;
  padding: 16px 18px;
  box-shadow: 0 18px 50px rgba(32, 33, 45, 0.16);
}
.upload-status-dialog p {
  margin-top: 3px;
  color: var(--muted);
  font-size: 11px;
}
.upload-status-dialog .spinner {
  width: 22px;
  height: 22px;
  border: 2px solid #d8cdf3;
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: revector-spin 1s linear infinite;
  flex: 0 0 auto;
}
@media (prefers-reduced-motion: reduce) {
  .upload-status-dialog .spinner { animation: none; }
}

/* Download workspace must remain bounded on narrow production screens. */
.export-formats .format {
  min-width: 0;
  white-space: normal;
  overflow-wrap: anywhere;
}
.export-formats .format small,
.download-part > span,
.download-part small,
.pack-copy,
.post-download > div {
  min-width: 0;
  overflow-wrap: anywhere;
}
@media (max-width: 480px) {
  .download-parts,
  .export-formats {
    grid-template-columns: 1fr;
  }
}

/* ReVector / JerseyOS approved workstation theme. */
:root{color-scheme:dark;--brand:#d6af64;--brand-soft:#272419;--ink:#e6edf5;--muted:#8d9cab;--surface:#07111d;--canvas:#040b14;--panel:#0c1928;--border:#243246;--green:#50c99b;--green-soft:#112d28;--amber:#e5be70;--amber-soft:#302719;--red:#f08591}
body{background:radial-gradient(ellipse at 45% 0,#11243a 0,#07111d 65%);min-height:100vh}
button,input,select,textarea{color:var(--ink)}
button,input,select,textarea,.card,.topbar,.menu-popover,.connection-strip,.file-facts span,.part-card,.part-mini{background:var(--panel)}
input,select,textarea{border:1px solid var(--border);border-radius:7px;padding:10px;max-width:100%}
button:hover:not(:disabled){background:#152538;border-color:#827047}
.primary,.primary:hover:not(:disabled){background:linear-gradient(135deg,#dbb76e,#c69b50);border-color:#ddb872;color:#141a22;font-weight:650;box-shadow:0 3px 12px #0003}

    <div id="app"><div class="account-login admin-login"><a class="console-brand" href="/" data-account="nav"><span class="gold-mark">R</span><strong>ReVector AI</strong></a><section class="login-card"><div class="section-kicker">Support & Operations Console</div><h1>Admin Sign In</h1><p class="muted">Authorized administrators and support staff only.</p><form class="account-form" data-account-form="admin-login"><fieldset ><label class="account-field"><span>Admin Email</span><input name="email" type="email" value="" required autocomplete="username"></label><label class="account-field"><span>Password</span><input name="password" type="password" value="" required autocomplete="current-password"></label><button class="primary" type="submit" >Sign In to Admin Console</button></fieldset></form></section></div></div>

  <script>
(() => {
  // src/account-model.js
  var account = {
    revision: 0,
    configured: null,
    profile: null,
    adminProfile: null,
    menu: false,
    busy: false,
    error: "",
    notice: "",
    data: {},
    ticket: null,
    messages: [],
    offset: 0
  };
  var userPages = [
    ["profile", "Profile"],
    ["balance", "Balance"],
    ["add-credits", "Add Credits"],
    ["usage", "Usage"],
    ["models", "Select Models"],
    ["support", "Support"]
  ];
  var adminPages = [
    ["overview", "Overview"],
    ["users", "Users"],
    ["wallets", "Wallet / Balances"],
    ["credits", "Credit Requests"],
    ["usage", "Usage Logs"],
    ["models", "Model Requests"],
    ["support", "Support Inbox"],
    ["audit", "Audit Log"],
    ["settings", "Settings"]
  ];
  function currentPath() {
    return typeof location !== "undefined" ? location.pathname || "/" : "/";
  }
  function accountPage() {
    const path = currentPath();
    return path.startsWith("/admin") ? path === "/admin/login" ? "admin-login" : path.split("/")[2] || "overview" : path.startsWith("/dashboard") ? path.split("/")[2] || "dashboard" : path === "/login" ? "login" : null;
  }

  // src/account-controller.js
  var redraw = () => {
  };
  function registerAccountRenderer(renderer) {
    redraw = () => {
      account.revision++;
      renderer();
    };
  }
  async function accountRequest(path, method = "GET", body) {
    let response;
    try {
      response = await fetch(path, {
        method,
        credentials: "same-origin",
        headers: body ? { "Content-Type": "application/json" } : {},
        body: body ? JSON.stringify(body) : void 0,
        signal: AbortSignal.timeout(12e3)
      });
    } catch {
      throw new Error(
        typeof navigator !== "undefined" && !navigator.onLine ? "No internet connection. Account changes have not been submitted." : "Account service could not be reached. Retry when the connection returns."
      );
    }
    let data;
    try {
      const raw = await response.text();
      if (raw.length > 1024 * 1024) throw new Error();
      data = JSON.parse(raw);
    } catch {
      throw new Error("Account service returned an invalid response.");
    }
    if (!response.ok)
      throw Object.assign(
        new Error(data.error?.message || "Account request failed."),
        { status: response.status, code: data.error?.code }
      );
    return data;
  }
  async function navigateAccount(path) {
    if (!/^\/(?:dashboard(?:\/[^?#]*)?|admin(?:\/[^?#]*)?|login)?$/.test(path))
      return;
    history.pushState({}, "", path);
    account.menu = false;
    account.error = "";
    account.notice = "";
    account.ticket = null;
    account.editUser = null;
    account.editModel = null;
    account.offset = 0;
    account.data = {};
    redraw();
    await loadAccountPage();
    if (path === "/")
      window.dispatchEvent(new CustomEvent("revector:open-workspace"));
  }
  async function guarded(work) {
    account.busy = true;
    account.error = "";
    redraw();
    try {
      return await work();
    } catch (e2) {
      account.error = e2.message;
      if (e2.status === 401 && currentPath().startsWith("/admin") && currentPath() !== "/admin/login") {
        account.adminProfile = null;
        history.replaceState({}, "", "/admin/login");
      }
      return null;
    } finally {
      account.busy = false;
      redraw();
    }
  }
  async function initializeAccount() {
    const params = new URLSearchParams(
      typeof location !== "undefined" ? location.search : ""
    );
    const token = params.get("token_hash");
    if (token) history.replaceState({}, "", currentPath());
    try {
      const result = await accountRequest("/api/account/bootstrap");
      account.configured = result.configured;
      account.profile = result.profile;
    } catch {
      account.configured = null;
    }
    if (currentPath().startsWith("/admin") && currentPath() !== "/admin/login") {
      try {
        account.adminProfile = (await accountRequest("/api/admin/session")).profile;
      } catch (e2) {
        account.error = e2.message;
        history.replaceState({}, "", "/admin/login");
      }
    }
    if (account.configured === true && !account.profile && currentPath() === "/")
      history.replaceState({}, "", "/login");
    if (token && params.get("type") === "invite") {
      history.replaceState({}, "", "/login");
      await guarded(async () => {
        const data = await accountRequest("/api/auth/invitation", "POST", {
          token_hash: token
        });
        account.profile = data.profile;
        history.replaceState({}, "", "/dashboard/profile");
        account.notice = "Invitation accepted. Set your password.";
      });
    } else if (typeof location !== "undefined" && location.hash.includes("access_token")) {
      history.replaceState({}, "", currentPath());
      account.error = "Use the secure invitation link provided by the owner.";
    }
    await loadAccountPage();
    redraw();
  }
  async function loadAccountPage() {
    const page = accountPage();
    if (!page || ["login", "admin-login"].includes(page) || account.configured === false)
      return;
    await guarded(async () => {
      const offset = "?offset=" + account.offset;
      if (currentPath().startsWith("/admin")) {
        if (!account.adminProfile)
          account.adminProfile = (await accountRequest("/api/admin/session")).profile;
        if (account.adminProfile.role === "SUPPORT" && page !== "support") {
          history.replaceState({}, "", "/admin/support");
          return loadAccountPage();
        }
        if (page === "settings") {
          const [settings, catalog] = await Promise.all([
            accountRequest("/api/admin/settings"),
            accountRequest("/api/admin/models")
          ]);
          account.data = { settings, catalog: catalog.items };
        } else if (["credits", "models"].includes(page)) {
          const [requests, catalog] = await Promise.all([
            accountRequest(
              "/api/admin/requests" + offset + "&type=" + (page === "credits" ? "TOPUP" : "MODEL_CHANGE")
            ),
            accountRequest("/api/admin/models")
          ]);
          account.data = { items: requests.items, catalog: catalog.items };
        } else account.data = await accountRequest("/api/admin/" + page + offset);
        return;
      }
      if (!account.profile) return;
      const pages = {
        dashboard: ["wallet", "usage", "models", "preferences"],
        balance: ["wallet", "transactions"],
        "add-credits": ["requests"],
        usage: ["usage"],
        models: ["models", "preferences", "requests"],
        support: ["requests"],
        profile: []
      };
      const pairs = await Promise.all(
        (pages[page] || []).map(async (key) => [
          key,
          await accountRequest("/api/account/" + key + offset)
        ])
      );
      account.data = Object.fromEntries(pairs);
      if (pairs.some(([, data]) => data.accounting_warning))
        account.notice = "Some completed usage is awaiting reconciliation. Current records are shown; refresh after the engine reconnects.";
    });
  }
  async function accountClick(target) {
    const action = target.dataset.account;
    if (action === "menu") {
      account.menu = !account.menu;
      redraw();
      return;
    }
    if (action === "nav")
      return navigateAccount(
        target.dataset.url || new URL(target.href, location.origin).pathname
      );
    if (action === "refresh") return loadAccountPage();
    if (action === "next" || action === "previous") {
      account.offset = Math.max(
        0,
        account.offset + (action === "next" ? 50 : -50)
      );
      return loadAccountPage();
    }
    if (action === "logout" || action === "admin-logout")
      return guarded(async () => {
        await accountRequest(
          action === "logout" ? "/api/auth/logout" : "/api/admin/auth/logout",
          "POST",
          {}
        );
