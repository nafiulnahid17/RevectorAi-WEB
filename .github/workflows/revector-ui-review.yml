name: ReVector WEB Verification

on:
  push:
    branches:
      - main
      - revector-ui-ux-upgrade-20261004
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax checks
        run: npm run check
      - name: Unit and build tests
        run: npm test
      - name: Install browser test runtime
        run: |
          npx playwright install --with-deps chromium
      - name: Standalone browser preview smoke
        run: |
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -name chrome | head -1)"
          CHROMIUM_PATH="$CHROME" node scripts/browser-preview-smoke.cjs

      - name: User account browser tests (test-only fixtures)
        run: |
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -name chrome | head -1)"
          CHROMIUM_PATH="$CHROME" node scripts/browser-account.cjs
      - name: Upload frontend QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-qa
          path: test-results/

  engine-browser:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout web review branch
        uses: actions/checkout@v4
      - name: Checkout matching engine commit read-only
        uses: actions/checkout@v4
        with:
          repository: nafiulnahid17/RevectorAI-Tool
          ref: f27a0d4b66c6b222dde0ad6131c61cfb048ce9b7
          path: engine
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install deterministic conversion dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y inkscape ghostscript poppler-utils potrace tesseract-ocr unzip
      - name: Install web and engine dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python -m venv engine/.venv
          engine/.venv/bin/pip install --upgrade pip
          (cd engine && .venv/bin/pip install -r requirements.txt)
      - name: Verify matching engine regression suite
        working-directory: engine
        run: .venv/bin/pytest
      - name: Build web workspace
        run: npm run build
      - name: Start matching engine and secured local Worker
        env:
          REVECTOR_ALLOW_UNAUTHENTICATED: "false"
          REVECTOR_DATA_DIR: ${{ runner.temp }}/revector-ui-review
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          TEST_ENGINE_KEY="$(openssl rand -hex 32)"
          TEST_SESSION_KEY="$(openssl rand -hex 32)"
          export REVECTOR_API_KEY="$TEST_ENGINE_KEY"
          (
            cd engine
            .venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8012 > ../engine-review.log 2>&1 &
            echo $! > ../engine-review.pid
          )
          umask 077
          cat > .dev.vars <<EOF
          ENGINE_ORIGIN=http://127.0.0.1:8012
          ALLOW_INSECURE_LOCAL_ENGINE=true
          ENGINE_API_KEY=$TEST_ENGINE_KEY
          SESSION_SIGNING_KEY=$TEST_SESSION_KEY
          SUPABASE_URL=
          SUPABASE_ANON_KEY=
          SUPABASE_SERVICE_ROLE_KEY=
          EOF
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > worker-review.log 2>&1 &
          echo $! > worker-review.pid
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8012/health >/dev/null && break
            sleep 1
          done
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8787/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8012/health
          curl -fsS http://127.0.0.1:8787/health
      - name: Real browser production workflow
        run: |
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -name chrome | head -1)"
          CHROMIUM_PATH="$CHROME" REVECTOR_TEST_URL=http://127.0.0.1:8787 node scripts/browser-smoke.cjs
      - name: Session and ownership security browser regression
        run: |
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -name chrome | head -1)"
          CHROMIUM_PATH="$CHROME" REVECTOR_TEST_URL=http://127.0.0.1:8787 node scripts/browser-security.cjs
      - name: Show service logs on failure
        if: failure()
        run: |
          tail -n 250 engine-review.log || true
          tail -n 250 worker-review.log || true
      - name: Upload production workflow QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-browser-qa
          path: test-results/
      - name: Stop local services
        if: always()
        run: |
          test -f worker-review.pid && kill "$(cat worker-review.pid)" || true
          test -f engine-review.pid && kill "$(cat engine-review.pid)" || true
          rm -f .dev.vars
